<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>접속 유저 대시보드</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #f5f4f0;
    --surface: #ffffff;
    --border:  rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.18);
    --text:    #1a1a18;
    --muted:   #6b6b67;
    --hint:    #9b9b96;
    --green:   #0f6e56;
    --green-bg:#e1f5ee;
    --amber:   #854f0b;
    --amber-bg:#faeeda;
    --red:     #a32d2d;
    --red-bg:  #fcebeb;
    --blue:    #185fa5;
    --blue-bg: #e6f1fb;
    --radius:  10px;
    --radius-lg: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1c1c1a;
      --surface: #282825;
      --border:  rgba(255,255,255,0.10);
      --border2: rgba(255,255,255,0.18);
      --text:    #e8e8e3;
      --muted:   #9b9b96;
      --hint:    #6b6b67;
      --green:   #9fe1cb;
      --green-bg:#04342c;
      --amber:   #fac775;
      --amber-bg:#412402;
      --red:     #f7c1c1;
      --red-bg:  #501313;
      --blue:    #b5d4f4;
      --blue-bg: #042c53;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container { max-width: 1100px; margin: 0 auto; }

  /* 상단 바 */
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem;
  }
  .topbar h1 { font-size: 20px; font-weight: 600; }
  .topbar p  { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--green-bg); color: var(--green);
    font-size: 12px; font-weight: 500; padding: 5px 12px;
    border-radius: 99px;
  }
  .live-badge .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* 메트릭 카드 */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .metric {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .metric-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .metric-value { font-size: 24px; font-weight: 600; }
  .metric-value.green { color: var(--green); }
  .metric-value.amber { color: var(--amber); }
  .metric-value.blue  { color: var(--blue);  }

  /* 컨트롤 바 */
  .controls {
    display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; margin-bottom: 1rem;
  }
  .controls input, .controls select {
    font-size: 13px; padding: 7px 11px;
    border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: var(--surface); color: var(--text);
    outline: none; transition: border-color .15s;
  }
  .controls input { flex: 1; min-width: 180px; }
  .controls input:focus { border-color: var(--blue); }
  .btn {
    font-size: 13px; padding: 7px 14px;
    border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: transparent; color: var(--text);
    cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--bg); }

  /* 테이블 */
  .table-wrap {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--bg); }
  th {
    text-align: left; padding: 10px 14px;
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    color: var(--muted); text-transform: uppercase;
    border-bottom: 0.5px solid var(--border);
    white-space: nowrap;
  }
  td { padding: 11px 14px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }

  /* 유저 셀 */
  .user-cell { display: flex; align-items: center; gap: 9px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .user-name  { font-weight: 500; font-size: 13px; }
  .user-id    { font-size: 11px; color: var(--hint); margin-top: 1px; }
  .ip         { font-family: 'Courier New', monospace; font-size: 12px; color: var(--muted); }

  /* 상태 뱃지 */
  .status {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 500; padding: 3px 9px;
    border-radius: 99px;
  }
  .status .sdot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .s-online { background: var(--green-bg); color: var(--green); }
  .s-idle   { background: var(--amber-bg); color: var(--amber); }
  .s-away   { background: var(--border); color: var(--muted); }

  /* 킥 버튼 */
  .kick-btn {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid rgba(163,45,45,.5); border-radius: 7px;
    background: transparent; color: var(--red);
    cursor: pointer; transition: background .15s;
  }
  .kick-btn:hover { background: var(--red-bg); }

  /* 빈 상태 */
  .empty { text-align: center; padding: 3rem; color: var(--hint); font-size: 13px; }

  /* 에러 배너 */
  .error-banner {
    background: var(--red-bg); color: var(--red);
    border: 0.5px solid rgba(163,45,45,.3); border-radius: var(--radius);
    padding: 10px 14px; font-size: 13px; margin-bottom: 1rem; display: none;
  }

  /* 토스트 */
  #toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: var(--surface); border: 0.5px solid var(--border2);
    border-radius: var(--radius); padding: 10px 16px;
    font-size: 13px; color: var(--text);
    opacity: 0; transform: translateY(8px);
    transition: all .2s; pointer-events: none; z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* 마지막 갱신 시각 */
  .refresh-info { font-size: 12px; color: var(--hint); margin-top: 10px; text-align: right; }

  @media (max-width: 600px) {
    th:nth-child(3), td:nth-child(3),
    th:nth-child(4), td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <div>
      <h1>접속 유저 대시보드</h1>
      <p>Flask API 실시간 연결 현황</p>
    </div>
    <div class="live-badge"><span class="dot"></span>실시간 모니터링</div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="metric-label">전체 접속자</div><div class="metric-value" id="m-total">—</div></div>
    <div class="metric"><div class="metric-label">온라인</div><div class="metric-value green" id="m-online">—</div></div>
    <div class="metric"><div class="metric-label">자리비움</div><div class="metric-value amber" id="m-idle">—</div></div>
    <div class="metric"><div class="metric-label">비활성</div><div class="metric-value blue" id="m-away">—</div></div>
  </div>

  <div class="error-banner" id="error-banner">서버에 연결할 수 없습니다. Flask 서버가 실행 중인지 확인하세요.</div>

  <div class="controls">
    <input type="text" id="search" placeholder="유저명 또는 IP 검색…" oninput="render()" />
    <select id="filter" onchange="render()">
      <option value="all">전체 상태</option>
      <option value="online">온라인</option>
      <option value="idle">자리비움</option>
      <option value="away">비활성</option>
    </select>
    <button class="btn" onclick="fetchUsers()">새로고침 ↻</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>유저</th>
          <th>IP 주소</th>
          <th>접속 시간</th>
          <th>마지막 활동</th>
          <th>상태</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="6" class="empty">데이터를 불러오는 중…</td></tr>
      </tbody>
    </table>
  </div>

  <p class="refresh-info" id="refresh-info"></p>
</div>

<div id="toast"></div>

<script>
const API = "";  // 같은 origin이면 빈 문자열, 별도 서버라면 "http://localhost:5000"

let allUsers = [];
const avatarPalette = [
  {bg:'#e1f5ee',tx:'#0f6e56'},{bg:'#e6f1fb',tx:'#185fa5'},
  {bg:'#eeedfe',tx:'#3c3489'},{bg:'#faeeda',tx:'#633806'},
  {bg:'#faece7',tx:'#712b13'},{bg:'#fbeaf0',tx:'#72243e'},
];

// ── 시간 포맷 ────────────────────────────────────────────────

function timeAgo(epochSec) {
  const d = Math.floor(Date.now()/1000 - epochSec);
  if (d < 60) return `${d}초 전`;
  if (d < 3600) return `${Math.floor(d/60)}분 전`;
  return `${Math.floor(d/3600)}시간 ${Math.floor((d%3600)/60)}분 전`;
}

function duration(epochSec) {
  const d = Math.floor(Date.now()/1000 - epochSec);
  if (d < 60) return `${d}초`;
  if (d < 3600) return `${Math.floor(d/60)}분`;
  return `${Math.floor(d/3600)}시간 ${Math.floor((d%3600)/60)}분`;
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  return parts.length >= 2
    ? parts[0][0] + parts[parts.length-1][0]
    : name.slice(0, 2);
}

function statusLabel(s) {
  return {online:'온라인', idle:'자리비움', away:'비활성'}[s] || s;
}

// ── 렌더링 ────────────────────────────────────────────────────

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const f = document.getElementById('filter').value;

  let list = allUsers.slice();
  if (q) list = list.filter(u => u.name.toLowerCase().includes(q) || u.ip.includes(q));
  if (f !== 'all') list = list.filter(u => u.status === f);

  const tbody = document.getElementById('tbody');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">접속 중인 유저가 없습니다.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map((u, i) => {
    const c = avatarPalette[i % avatarPalette.length];
    return `<tr>
      <td>
        <div class="user-cell">
          <div class="avatar" style="background:${c.bg};color:${c.tx}">${initials(u.name)}</div>
          <div>
            <div class="user-name">${escHtml(u.name)}</div>
            <div class="user-id">${u.id.slice(0,8)}…</div>
          </div>
        </div>
      </td>
      <td class="ip">${escHtml(u.ip)}</td>
      <td>${duration(u.connected_at)}</td>
      <td>${timeAgo(u.last_activity)}</td>
      <td><span class="status s-${u.status}"><span class="sdot"></span>${statusLabel(u.status)}</span></td>
      <td><button class="kick-btn" onclick="kickUser('${u.id}','${escAttr(u.name)}')">연결 해제</button></td>
    </tr>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/'/g,'&#39;');
}

// ── API 호출 ─────────────────────────────────────────────────

async function fetchUsers() {
  try {
    const res = await fetch(`${API}/api/users`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    allUsers = data.users || [];

    document.getElementById('m-total').textContent  = data.total  ?? allUsers.length;
    document.getElementById('m-online').textContent = data.online ?? '—';
    document.getElementById('m-idle').textContent   = data.idle   ?? '—';
    document.getElementById('m-away').textContent   = data.away   ?? '—';
    document.getElementById('error-banner').style.display = 'none';

    const now = new Date().toLocaleTimeString('ko-KR');
    document.getElementById('refresh-info').textContent = `마지막 갱신: ${now}`;
  } catch (e) {
    document.getElementById('error-banner').style.display = 'block';
  }
  render();
}

async function kickUser(id, name) {
  if (!confirm(`'${name}'의 연결을 해제하시겠습니까?`)) return;
  try {
    const res = await fetch(`${API}/api/kick/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(res.status);
    toast(`${name} 연결이 해제되었습니다.`);
    fetchUsers();
  } catch {
    toast('연결 해제에 실패했습니다.');
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── 초기화 및 자동 갱신 ──────────────────────────────────────

fetchUsers();
setInterval(fetchUsers, 5000);  // 5초마다 자동 갱신
</script>
</body>
</html>
